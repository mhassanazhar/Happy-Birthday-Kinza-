<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --magenta: #c2187d;
    --pink: #ee3b90;
    --pink-soft: #ff8fbe;
    --red: #e11d48;
    --red-deep: #be123c;
    --rose: #ff4d8d;
    --blush: #ffe9f1;
    --blush-2: #ffd0e1;
    --ink: #4a1030;
    --muted: #9a5b76;
    --card: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --blush: #ffe4ee; --card: #ffffff; --ink: #4a1030; }
  }
  :root[data-theme="dark"] { --blush: #ffe4ee; --card: #ffffff; --ink: #4a1030; }

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: #d81b8a;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Background ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(160deg, var(--magenta) 0%, var(--pink) 48%, var(--pink-soft) 100%);
    background-size: 220% 220%;
    animation: bgshift 16s ease-in-out infinite alternate;
  }
  @keyframes bgshift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  .float {
    position: absolute; bottom: -70px; left: var(--x);
    font-size: var(--s); line-height: 1; color: var(--c); opacity: 0;
    animation: rise var(--d) linear var(--dl) infinite;
    user-select: none; pointer-events: none;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: var(--o); }
    90%  { opacity: var(--o); }
    100% { transform: translate3d(var(--sx), -118vh, 0) rotate(var(--r)); opacity: 0; }
  }

  /* ---------- App shell ---------- */
  .app {
    position: relative; z-index: 2;
    width: min(94vw, 390px);
    height: min(780px, calc(100dvh - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
    min-height: 520px;
  }
  @supports not (height: 100dvh) {
    .app { height: min(780px, calc(100vh - 28px)); }
  }
  .app::before {
    content: ''; position: absolute; inset: -12% -18%; z-index: -1; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 210, 230, .55), rgba(255, 150, 195, 0) 68%);
    filter: blur(6px); animation: glow 5.5s ease-in-out infinite alternate;
  }
  @keyframes glow { from { opacity: .55; transform: scale(.96); } to { opacity: .95; transform: scale(1.04); } }
  .card {
    position: relative; width: 100%; height: 100%;
    background: linear-gradient(180deg, #fffafc 0%, #ffffff 34%);
    border-radius: 34px;
    box-shadow: 0 24px 60px rgba(120, 0, 60, .38), 0 4px 14px rgba(120, 0, 60, .18), 0 0 0 1px rgba(255, 255, 255, .6) inset;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .progress { display: flex; gap: 4px; padding: 16px 20px 0; flex: none; }
  .progress i { flex: 1; height: 4px; border-radius: 4px; background: #ffdbe8; transition: background .4s; }
  .progress i.done { background: linear-gradient(90deg, var(--rose), var(--red)); }
  .stage { position: relative; flex: 1; min-height: 0; }
  .screen {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    padding: 14px 22px 26px; display: flex; text-align: center;
    animation: screenIn .55s cubic-bezier(.2, .8, .2, 1) both;
  }
  .screen.out { animation: screenOut .26s ease-in both; }
  @keyframes screenIn  { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes screenOut { to { opacity: 0; transform: translateY(-14px) scale(.98); } }
  .wrap { margin: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }

  /* ---------- Type ---------- */
  h1, h2 { margin: 0; line-height: 1.1; }
  h1.script { font-family: 'Pacifico', 'Brush Script MT', cursive; font-weight: 400; font-size: 46px; color: var(--red); }
  h2 { font-size: 27px; font-weight: 900; letter-spacing: -.01em; color: var(--red-deep); }
  .sub { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); line-height: 1.45; max-width: 290px; }
  .script { font-family: 'Pacifico', 'Brush Script MT', cursive; font-weight: 400; }

  /* ---------- Buttons ---------- */
  [hidden] { display: none !important; }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: 800 17px/1 'Nunito', system-ui, sans-serif; color: #fff;
    padding: 17px 30px; min-width: 210px; border-radius: 999px;
    background: linear-gradient(135deg, var(--rose), var(--red));
    box-shadow: 0 10px 22px rgba(225, 29, 72, .34), inset 0 -3px 0 rgba(0, 0, 0, .12);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: #fff0f5; color: var(--red-deep); box-shadow: inset 0 0 0 2px #ffc2d8; }
  .btn.sm { min-width: 0; padding: 15px 30px; }
  .btn:focus-visible, .tile:focus-visible, .balloon:focus-visible, .photo:focus-visible, .env:focus-visible {
    outline: 3px solid var(--red); outline-offset: 3px;
  }
  .btn.enter { animation: btnIn .5s cubic-bezier(.2, .9, .3, 1.3) both; }
  @keyframes btnIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }

  /* ---------- Screen 1: hello ---------- */
  .circle-frame {
    width: 218px; height: 218px; border-radius: 50%; overflow: hidden;
    border: 6px solid #fff; box-shadow: 0 0 0 4px var(--blush-2), 0 14px 30px rgba(190, 18, 60, .25);
    animation: bob 3.4s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.25); } 40% { transform: scale(1); } 60% { transform: scale(1.15); } }

  /* ---------- Screen 2: ready ---------- */
  .gift { font-size: 76px; line-height: 1; animation: wobble 1.6s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.06); } }
  .yn { display: flex; gap: 14px; align-items: center; justify-content: center; min-height: 64px; flex-wrap: wrap; }
  .yn .btn { min-width: 110px; padding: 16px 26px; }

  /* ---------- Screen 3: countdown ---------- */
  .count-ring {
    width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #fff, var(--blush));
    box-shadow: 0 0 0 8px var(--blush-2), 0 0 0 16px #ffeaf2;
    display: grid; place-items: center;
  }
  .count { font: 900 108px/1 'Nunito', sans-serif; color: var(--red); }
  .count.pulse { animation: pulse .9s ease-out; }
  @keyframes pulse { 0% { transform: scale(.4); opacity: 0; } 35% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

  /* ---------- Screen 4: puzzle ---------- */
  .puzzle {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    width: min(270px, 100%); aspect-ratio: 1; padding: 4px;
    background: var(--blush-2); border-radius: 22px; transition: gap .4s, padding .4s, background .4s, box-shadow .4s;
  }
  .tile {
    appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 12px;
    background-size: 300% 300%; background-repeat: no-repeat;
    transition: transform .18s, box-shadow .18s, border-radius .4s;
  }
  .tile.sel { transform: scale(.9); box-shadow: 0 0 0 4px var(--red); }
  .tile.bump { animation: bump .3s ease; }
  @keyframes bump { 50% { transform: scale(1.08); } }
  .puzzle.solved { gap: 0; padding: 0; background: transparent; box-shadow: 0 14px 30px rgba(190, 18, 60, .3); overflow: hidden; }
  .puzzle.solved .tile { border-radius: 0; pointer-events: none; }

  /* ---------- Screen 5: scratch ---------- */
  .scratch { position: relative; width: 100%; max-width: 300px; height: 176px; border-radius: 24px; overflow: hidden; box-shadow: 0 12px 26px rgba(190, 18, 60, .25); }
  .scratch .under {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 20px;
    background: linear-gradient(135deg, #fff5f9, var(--blush-2));
    font: 900 21px/1.3 'Nunito', sans-serif; color: var(--red-deep);
  }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .7s; }
  .scratch canvas.gone { opacity: 0; pointer-events: none; }

  /* ---------- Screen 6: memories ---------- */
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .photo {
    position: relative; aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; overflow: hidden;
    border-radius: 20px; background: var(--blush) center / cover no-repeat;
    box-shadow: 0 8px 18px rgba(190, 18, 60, .2); transition: transform .2s;
  }
  .photo:nth-child(odd) { transform: rotate(-2deg); }
  .photo:nth-child(even) { transform: rotate(2deg); }
  .photo:hover { transform: rotate(0) scale(1.03); }
  .photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .photo .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px;
    color: #fff; font: 800 13px/1.1 'Nunito', sans-serif; text-shadow: 0 1px 4px rgba(0, 0, 0, .4);
    background: linear-gradient(transparent, rgba(60, 0, 30, .55));
  }
  .hint { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 0; }

  /* ---------- Screen 7: wrapped ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .stat { border-radius: 20px; padding: 14px 10px; background: var(--blush); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat .em { font-size: 24px; }
  .stat b { font-size: 28px; font-weight: 900; color: var(--red-deep); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat.hero { grid-column: 1 / -1; background: linear-gradient(135deg, var(--rose), var(--red)); padding: 20px 10px; }
  .stat.hero b { font-size: 50px; color: #fff; }
  .stat.hero small { color: #ffe1ec; font-size: 15px; }
  .stat.hero .em { font-size: 28px; }

  /* ---------- Screen 8: balloons ---------- */
  .sky { position: relative; width: 100%; height: 252px; border-radius: 24px; background: linear-gradient(#fff5f9, var(--blush)); overflow: hidden; }
  .balloon {
    position: absolute; width: 66px; height: 100px; border: 0; padding: 0; background: none; cursor: pointer;
    animation: sway var(--dur) ease-in-out var(--dl) infinite alternate;
  }
  .balloon svg { width: 100%; height: 100%; display: block; overflow: visible; }
  @keyframes sway { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-14px) rotate(3deg); } }
  .balloon.pop { animation: popB .22s ease-out forwards; pointer-events: none; }
  @keyframes popB { to { transform: scale(1.5); opacity: 0; } }
  .msg {
    width: 100%; min-height: 66px; display: grid; place-items: center; padding: 12px 16px;
    background: var(--blush); border-radius: 20px; font-size: 16px; font-weight: 800; color: var(--red-deep); line-height: 1.35;
  }
  .msg.flash { animation: flash .45s ease; }
  @keyframes flash { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Screen 9: letter ---------- */
  .env { position: relative; width: 250px; height: 164px; perspective: 700px; border: 0; padding: 0; background: none; cursor: pointer; transition: transform .5s, opacity .5s; }
  .env .back { position: absolute; inset: 0; background: #ff86ad; border-radius: 12px; box-shadow: 0 14px 26px rgba(190, 18, 60, .28); }
  .env .flap { position: absolute; left: 0; right: 0; top: 0; height: 92px; background: #ff5e9c; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s ease, background .3s; z-index: 3; border-radius: 12px 12px 0 0; }
  .env .front { position: absolute; inset: 0; background: #ff73a2; clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); border-radius: 12px; z-index: 2; }
  .env .seal { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 4; width: 42px; height: 42px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, .25); animation: beat 1.3s ease-in-out infinite; }
  .env.open .flap { transform: rotateX(180deg); background: #ff9dbd; z-index: 1; }
  .env.open .seal { display: none; }
  .env.gone { opacity: 0; transform: scale(.8) translateY(20px); pointer-events: none; }
  .paper {
    width: 100%; padding: 22px 20px 20px; text-align: left; border-radius: 16px;
    background: #fffdf7 repeating-linear-gradient(transparent 0 26px, rgba(255, 143, 190, .22) 26px 27px);
    box-shadow: 0 12px 26px rgba(190, 18, 60, .22);
    font-size: 15px; font-weight: 600; line-height: 27px; color: #5a1a3a;
    animation: rise2 .7s cubic-bezier(.2, .9, .3, 1) both;
  }
  .paper p { margin: 0 0 10px; }
  .paper .sign { font-family: 'Pacifico', cursive; color: var(--red); font-size: 19px; margin: 6px 0 0; opacity: 0; transition: opacity 1.1s ease; }
  .paper .w { opacity: 0; transition: opacity .5s ease; }
  .paper .w.in, .paper .sign.in { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .paper .w, .paper .sign { opacity: 1; transition: none; } }
  @keyframes rise2 { from { opacity: 0; transform: translateY(60px) scale(.9); } to { opacity: 1; transform: none; } }

  /* ---------- Screen 10: wish ---------- */
  .cake { width: 240px; height: auto; overflow: visible; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .45s ease-in-out infinite alternate; transition: opacity .5s, transform .5s; }
  .flame.f1 { animation-delay: .12s; } .flame.f2 { animation-delay: .25s; }
  @keyframes flick { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.08, 1.14) rotate(3deg); } }
  .flame.off { animation: none; opacity: 0; transform: scale(.2) translateY(-8px); }
  .smoke { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .smoke.on { animation: smoke 1.5s ease-out forwards; }
  @keyframes smoke { 0% { opacity: .65; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-46px) scale(2.4); } }

  /* ---------- Screen 11: final ---------- */
  .cat { width: 210px; height: auto; animation: bob 3s ease-in-out infinite; overflow: visible; }
  .final-title { font-family: 'Pacifico', 'Brush Script MT', cursive; font-size: 34px; line-height: 1.25; color: var(--red); margin: 0; }

  /* ---------- Confetti ---------- */
  #confetti { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

  @media (max-height: 640px) {
    .circle-frame { width: 170px; height: 170px; }
    h1.script { font-size: 38px; }
    .sky { height: 210px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg, .float, .circle-frame, .gift, .cat, .balloon, .beat, .flame, .seal, .app::before { animation: none !important; }
    .float { opacity: .35; bottom: 20%; }
  }
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="app">
  <section class="card">
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="stage" id="stage" aria-live="polite"></div>
  </section>
</main>

<script>
/* ======================================================================
   EDIT ME — change these to make it yours
   ====================================================================== */
const CONFIG = {
  scratchText: 'You are the best thing that has happened to me this year',
  memoryCaptions: ['The night we met', 'Sunset, just us', 'Under the stars', 'Slow afternoon'],
  stats: {
    hero: { n: 12847, label: 'texts, and still not enough', emoji: '💬' },
    others: [
      { n: 932, label: 'memes only we find funny', emoji: '😂' },
      { n: 365, label: 'days of loving you', emoji: '📅' },
      { n: 48,  label: 'nights we talked till sunrise', emoji: '🌙' },
      { text: '∞', label: 'reasons I love you', emoji: '💖' }
    ]
  },
  balloons: [
    'You make ordinary days feel like poetry ✨',
    'Your laugh is my favourite sound in the world 🎶',
    'Home was never a place. It was always you 🏡',
    "In every lifetime, I'd still find you first 💞",
    'Loving you is the easiest thing I do 🌹'
  ],
  letter: [
    'My love,',
    "Another year older, and somehow I keep falling for you a little more each day. Thank you for the sleepy good-mornings, the silly voice notes, and for making even the quietest ordinary evenings feel like something I'd never trade.",
    'You are my calm and my favourite kind of chaos. Whatever this year brings you, I want to be the one standing right beside you through all of it.',
    'Happy birthday, my heart.'
  ],
  letterSign: 'Forever yours ❤'
};

/* ======================================================================
   Background: drifting hearts + party poppers
   ====================================================================== */
(function makeBackground() {
  const bg = document.getElementById('bg');
  const colors = ['rgba(255,255,255,.55)', 'rgba(255,60,110,.7)', 'rgba(255,182,213,.85)', 'rgba(190,18,60,.55)', 'rgba(255,120,160,.75)'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const count = matchMedia('(max-width:520px)').matches ? 26 : 40;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    const popper = i % 9 === 4;
    const petal = i % 5 === 1;
    const sparkle = i % 11 === 7;
    el.className = 'float';
    el.textContent = popper ? '🎉' : petal ? '🌸' : sparkle ? '✦' : '♥';
    el.style.setProperty('--x', rand(-2, 98) + '%');
    el.style.setProperty('--s', (popper ? rand(20, 30) : petal ? rand(14, 26) : sparkle ? rand(10, 18) : rand(14, 48)) + 'px');
    el.style.setProperty('--c', colors[i % colors.length]);
    el.style.setProperty('--o', popper ? .6 : rand(.35, .8).toFixed(2));
    el.style.setProperty('--d', rand(11, 24).toFixed(1) + 's');
    el.style.setProperty('--dl', (-rand(0, 24)).toFixed(1) + 's');
    el.style.setProperty('--sx', rand(-70, 70).toFixed(0) + 'px');
    el.style.setProperty('--r', rand(-40, 40).toFixed(0) + 'deg');
    bg.appendChild(el);
  }
})();

/* ======================================================================
   Confetti
   ====================================================================== */
const cf = document.getElementById('confetti');
const cctx = cf.getContext('2d');
let W = 0, H = 0, parts = [], raf = 0;
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cf.width = W * dpr; cf.height = H * dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit); fit();
const CONFETTI = ['#ff4d8d', '#e11d48', '#ffd166', '#ffffff', '#ff9ec4', '#ffb703', '#c77dff'];
function burst(x = W / 2, y = H / 2, n = 80, spread = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 9) * spread;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, g: .28,
      w: 5 + Math.random() * 7, h: 3 + Math.random() * 5,
      r: Math.random() * 6, vr: (Math.random() - .5) * .5,
      c: CONFETTI[i % CONFETTI.length], heart: Math.random() < .25, life: 1
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life > 0 && p.y < H + 40);
  for (const p of parts) {
    p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .008;
    cctx.save();
    cctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
    cctx.translate(p.x, p.y); cctx.rotate(p.r); cctx.fillStyle = p.c;
    if (p.heart) { cctx.font = '16px sans-serif'; cctx.fillText('♥', -6, 6); }
    else cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
  if (parts.length) raf = requestAnimationFrame(tick);
  else { raf = 0; cctx.clearRect(0, 0, W, H); }
}
function burstFrom(el, n, spread) {
  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, n, spread);
}

/* ======================================================================
   Illustrations (inline SVG)
   ====================================================================== */
const BEARS = `
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Two cartoon bears hugging">
  <defs>
    <radialGradient id="bearBg" cx="50%" cy="30%" r="85%"><stop offset="0" stop-color="#fff7fa"/><stop offset="1" stop-color="#ffd0e1"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bearBg)"/>
  <text x="26" y="52" font-size="13" fill="#ff9ec4">♥</text>
  <text x="168" y="70" font-size="16" fill="#ff8fb8">♥</text>
  <text x="150" y="30" font-size="10" fill="#ffb3cc">♥</text>
  <text x="40" y="96" font-size="9" fill="#ffb3cc">♥</text>
  <!-- bodies -->
  <ellipse cx="72" cy="160" rx="34" ry="42" fill="#a86a3d"/>

screens.push((root, next) => {
  root.innerHTML = `
    <h2>Put my heart back together</h2>

    <div class="puzzle" id="pz"></div>

    <button class="btn" id="nx" hidden>Continue</button>`;
  const pz = $('#pz', root), mv = $('#mv', root), nx = $('#nx', root), hint = $('#hint', root);
  let order = [...Array(9).keys()];
  do {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  } while (order.filter((v, i) => v === i).length > 2);
  let sel = -1, moves = 0;
  const tiles = order.map((_, pos) => {
    const t = document.createElement('button');
    t.className = 'tile';
    t.style.backgroundImage = PUZZLE_URI;
    t.setAttribute('aria-label', `Puzzle piece ${pos + 1}`);
    t.onclick = () => pick(pos);
    pz.appendChild(t);
    return t;
  });
  const paint = () => tiles.forEach((t, pos) => {
    const id = order[pos];
    t.style.backgroundPosition = `${(id % 3) * 50}% ${Math.floor(id / 3) * 50}%`;
    t.classList.toggle('sel', pos === sel);
  });
  function pick(pos) {
    if (sel === -1) { sel = pos; paint(); return; }
    if (sel === pos) { sel = -1; paint(); return; }
    [order[sel], order[pos]] = [order[pos], order[sel]];
    [tiles[sel], tiles[pos]].forEach(t => { t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); });
    sel = -1; moves++; mv.textContent = `Moves: ${moves}`;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = sc.clientWidth, h = sc.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#ff5c7a'); g.addColorStop(1, '#b80f3c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.font = '22px sans-serif';
  for (let y = 18; y < h + 20; y += 34) for (let x = ((y / 34) % 2) * 17 + 6; x < w; x += 34) ctx.fillText('♥', x, y);
  ctx.fillStyle = '#fff'; ctx.font = '900 22px Nunito, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Scratch here ✨', w / 2, h / 2 + 8);

  let drawing = false, last = null, moves = 0, done = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function line(a, b) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 42; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function cleared() {
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let c = 0, total = 0;
    for (let i = 3; i < d.length; i += 64) { total++; if (d[i] < 40) c++; }
    return c / total;
  }
  function finish() {
    if (done) return; done = true;
    cv.classList.add('gone');
    nx.hidden = false; nx.classList.add('enter');
    burstFrom(sc, 70, .9);
  }
  cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); last = pos(e); line(last, last); });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e); line(last, p); last = p;
    if (++moves % 8 === 0 && cleared() > .5) finish();
  });
  const stop = () => { drawing = false; if (!done && cleared() > .5) finish(); };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  nx.onclick = next;
});

    const b = document.createElement('button');
    b.className = 'balloon';
    b.setAttribute('aria-label', 'Balloon, tap to pop');
    b.style.left = spots[i % spots.length][0] + '%';
    b.style.top = spots[i % spots.length][1] + 'px';
    b.style.setProperty('--dur', (2.2 + i * .35).toFixed(2) + 's');
    b.style.setProperty('--dl', (-i * .5) + 's');
    const c = cols[i % cols.length];
    b.innerHTML = `<svg viewBox="0 0 60 90"><ellipse cx="30" cy="32" rx="26" ry="30" fill="${c}"/><path d="M26 61 l4 7 l4 -7z" fill="${c}"/><ellipse cx="19" cy="20" rx="6" ry="10" fill="#fff" opacity=".38" transform="rotate(20 19 20)"/><path d="M30 68 q-7 9 0 17 q6 7 0 4" stroke="#b5476b" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    b.onclick = () => {
      b.classList.add('pop');
      burstFrom(b, 22, .55);
      msg.textContent = m;
      msg.classList.remove('flash'); void msg.offsetWidth; msg.classList.add('flash');
      popped++;
      cnt.textContent = `${popped} of ${msgs.length} popped`;
      setTimeout(() => b.remove(), 230);
      if (popped === msgs.length) { nx.hidden = false; nx.classList.add('enter'); }
    };
    sky.appendChild(b);
  });
  nx.onclick = next;
});

// 9 — A Little Letter
screens.push((root, next) => {
  const body = CONFIG.letter.map(p =>
    `<p>${p.split(' ').map(w => `<span class="w">${w}</span>`).join(' ')}</p>`).join('');
  root.innerHTML = `
    <h2>A Little Letter</h2>
    <button class="env" id="env" aria-label="Open the envelope">
      <span class="back"></span><span class="flap"></span><span class="front"></span><span class="seal">♥</span>
    </button>
    <p class="sub" id="tap">Tap the envelope to open it</p>
    <div class="paper" id="paper" hidden>${body}<p class="sign">${CONFIG.letterSign}</p></div>
    <button class="btn sm" id="nx" hidden>Next</button>`;
  const env = $('#env', root), paper = $('#paper', root), nx = $('#nx', root), tap = $('#tap', root);
  let timers = [];
  env.onclick = () => {
    if (env.classList.contains('open')) return;
    env.classList.add('open');
    tap.hidden = true;
    timers.push(setTimeout(() => env.classList.add('gone'), 650));
    timers.push(setTimeout(() => {
      env.hidden = true; paper.hidden = false;
      const words = [...paper.querySelectorAll('.w')];
      const sign = $('.sign', paper);
      const step = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 55;
      words.forEach((w, i) => timers.push(setTimeout(() => w.classList.add('in'), 90 + i * step)));
      timers.push(setTimeout(() => {
        sign.classList.add('in');
        nx.hidden = false; nx.classList.add('enter');
      }, 200 + words.length * step));
    }, 1050));
  };
  nx.onclick = next;
  return () => timers.forEach(clearTimeout);
});

// 10 — Make a Wish
screens.push((root, next) => {
  root.innerHTML = `
    <h2>Make a Wish</h2>
    <p class="sub" id="wl">Close your eyes and wish for something big. I already got mine — it's you.</p>
    ${cakeSVG()}
    <button class="btn" id="blow">Blow out the candles 💨</button>
    <button class="btn" id="nx" hidden>One last thing</button>`;
  const blow = $('#blow', root), nx = $('#nx', root), wl = $('#wl', root);
  let started = false, timers = [];
  const out = () => {
    if (started) return; started = true;
    blow.disabled = true; blow.style.opacity = .6;
    [0, 1, 2].forEach(i => {
      timers.push(setTimeout(() => {
        $('#flame' + i, root).classList.add('off');
        $('#smoke' + i, root).classList.add('on');
      }, 300 + i * 420));
    });
    timers.push(setTimeout(() => {
      wl.textContent = 'Wish made. I hope every bit of it comes true ✨';
      blow.hidden = true; nx.hidden = false; nx.classList.add('enter');
      burst(W / 2, H * .4, 90, 1);
    }, 1750));
  };
  blow.onclick = out;
  [0, 1, 2].forEach(i => { const f = $('#flame' + i, root); f.style.cursor = 'pointer'; f.addEventListener('click', out); });
  nx.onclick = next;
  return () => timers.forEach(clearTimeout);
});

// 11 — Finale
screens.push((root, next, restart) => {
  root.innerHTML = `
    ${CAT}
    <p class="final-title">Happy Birthday,<br>My Love!</p>
    <p class="sub">Here's to another year of us — and every year after that 💕</p>
    <button class="btn ghost sm" id="again">Watch again</button>`;
  const ts = [200, 900, 1700].map((d, i) => setTimeout(() => burst(W * (.25 + i * .25), H * .35, 70, 1.05), d));
  $('#again', root).onclick = restart;
  return () => ts.forEach(clearTimeout);
});

/* ======================================================================
   Navigation
   ====================================================================== */
const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
screens.forEach(() => progress.appendChild(document.createElement('i')));
let cur = -1, busy = false, cleanup = null;

function paintProgress() {
  [...progress.children].forEach((el, i) => el.classList.toggle('done', i <= cur));
}
function go(i) {
  if (busy) return;
  busy = true;
  const old = stage.firstElementChild;
  const build = () => {
    if (cleanup) { cleanup(); cleanup = null; }
    stage.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'screen';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    el.appendChild(wrap);
    stage.appendChild(el);
    cur = i;
    paintProgress();
    cleanup = screens[i](wrap, next, restart) || null;
    busy = false;
  };
  if (old) { old.classList.add('out'); setTimeout(build, 260); } else build();
}
function next() { go(Math.min(cur + 1, screens.length - 1)); }
function restart() { go(0); }

go(0);
</script>
</body>
</html>
